name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP_FILE" -d android_project

          echo "ZIP extracted successfully."

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android_project -type f \
            -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
          | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            find android_project -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Update Android SDK target
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          find . -type f \
            -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
          -print
